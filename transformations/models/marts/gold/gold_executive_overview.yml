version: 2

models:
  - name: gold_executive_overview
    description: "Order-level logistics hub simulation dataset comparing baseline shipping metrics against consolidated hub optimization routes."
    columns:
      - name: order_key
        description: "Primary key linking to the order."
        tests:
          - not_null
      - name: customer_state
        description: "State abbreviation of the customer."
        tests:
          - not_null
      - name: actual_shipping_days
        description: "Actual calendar shipping days."
        tests:
          - not_null
      - name: actual_freight
        description: "Baseline freight cost."
        tests:
          - not_null
      - name: optimized_shipping_days
        description: "Simulated optimized transit days via regional hubs."
        tests:
          - not_null
      - name: optimized_freight
        description: "Simulated optimized consolidated freight cost."
        tests:
          - not_null
